[workspace]
members = [
    "programs/ghostset-live",
    "tests-magicsvm-rs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf", "access-control"] }
magicsvm = "=0.3.0"
solana-sdk = "=3.0.0"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
